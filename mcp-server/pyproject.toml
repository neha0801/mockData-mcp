[project]
name = "sqlmeta-mcp"
version = "0.1.0"
description = "Metadata-only SQL Server MCP server: fixed catalog queries, literal scrubbing, output check, audit log."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "dlp-patterns",
]

[project.optional-dependencies]
db = ["pyodbc>=5.1"]
keyring = ["keyring>=25"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "sqlglot>=26",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyodbc>=5.1",
    "keyring>=25",
]

[project.scripts]
sqlmeta-mcp = "sqlmeta_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlmeta_mcp"]

[tool.uv.sources]
dlp-patterns = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "../shared/dlp_patterns/tests"]
asyncio_mode = "auto"
markers = ["integration: needs a SQL Server instance (see tests/integration/README.md)"]
addopts = "-m 'not integration'"
