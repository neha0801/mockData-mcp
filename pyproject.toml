[tool.uv.workspace]
members = ["shared/dlp_patterns", "mcp-server"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]  # assert is fine in tests and for type narrowing

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
"mcp-server/src/sqlmeta_mcp/queries.py" = ["S608"]  # the SQL here is constant, by design

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
