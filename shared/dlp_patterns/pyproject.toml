[project]
name = "dlp-patterns"
version = "0.1.0"
description = "Detectors for data-like values (accounts, emails, names, LEIs). Shared by the MCP output check and the Claude Code hooks."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_patterns"]
